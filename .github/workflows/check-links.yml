# Checks every outbound link on the site (retailer product pages, search links, cited sources) once a week,
# and on pull requests that change links. A failed run means a link is really gone (404, or the site no
# longer exists); retailers that block bots are listed in the log but don't fail the run.
name: Check links

on:
  schedule:
    - cron: '41 9 * * 1' # Mondays, after the nightly price refresh
  workflow_dispatch:
  pull_request:
    paths: ['data/sources.json', 'src/**', 'scripts/check-links.mjs', '.github/workflows/check-links.yml']

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-links.mjs

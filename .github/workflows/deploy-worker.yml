# Publishes the community builds API (worker/) to Cloudflare's free Workers plan.
# Runs only from main, so nothing goes live until a pull request is merged.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# On its first run it creates the D1 database and a private salt for hashing visitor IPs.
# Optional secrets RESEND_API_KEY and MAILING_ADDRESS turn on price alert emails.
name: Deploy community API

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so the community API was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Find or create the database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          find_id() { $WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="firearm-designer");process.stdout.write(d?d.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then $WRANGLER d1 create firearm-designer; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/DATABASE_ID/$ID/" wrangler.toml
      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: $WRANGLER d1 migrations apply firearm-designer --remote
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: $WRANGLER deploy
      - name: Set the IP hashing salt (first run only)
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if ! $WRANGLER secret list | grep -q '"SALT"'; then
            node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))' | $WRANGLER secret put SALT
          fi
      # Price alert emails stay off until both of these repository secrets exist (see worker/src/alerts.js).
      - name: Set the price alert email settings
        if: steps.secrets.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILING_ADDRESS: ${{ secrets.MAILING_ADDRESS }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$MAILING_ADDRESS" ]; then
            printf '%s' "$RESEND_API_KEY" | $WRANGLER secret put RESEND_API_KEY
            printf '%s' "$MAILING_ADDRESS" | $WRANGLER secret put MAILING_ADDRESS
          else
            echo "::notice::RESEND_API_KEY and MAILING_ADDRESS aren't both set, so price alert emails stay off."
          fi
      # Share links with picture cards live on share.dropinbuilds.com. This attaches that address to the
      # Worker when the API token is allowed to; otherwise it says so, and it can be added by hand in the
      # Cloudflare dashboard (Workers & Pages > firearm-designer-api > Settings > Domains & Routes).
      - name: Attach share.dropinbuilds.com
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ZONE=$(curl -sS -H "$AUTH" "$API/zones?name=dropinbuilds.com" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write(r.result?.[0]?.id??"")})')
          if [ -z "$ZONE" ]; then
            echo "::warning::The API token can't see the dropinbuilds.com zone. Add share.dropinbuilds.com to the Worker as a custom domain in the Cloudflare dashboard."
            exit 1
          fi
          RES=$(curl -sS -X PUT -H "$AUTH" -H 'content-type: application/json' "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            --data "{\"hostname\":\"share.dropinbuilds.com\",\"service\":\"firearm-designer-api\",\"zone_id\":\"$ZONE\",\"environment\":\"production\"}")
          if echo "$RES" | grep -q '"success":true'; then
            echo "share.dropinbuilds.com is attached to the Worker."
          else
            echo "$RES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).errors)}catch{console.log(s)}})'
            echo "::warning::Couldn't attach share.dropinbuilds.com. Add it to the Worker as a custom domain in the Cloudflare dashboard."
            exit 1
          fi

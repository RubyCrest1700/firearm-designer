# Builds the site and publishes it to GitHub Pages (free for public repos).
# Pull requests only build and test; nothing is published until they merge.
# On the nightly schedule (or a manual run) it first refreshes data/prices.json
# from retailer product pages and commits the change. Only that job may push;
# pull request runs get read-only access.
name: Build, update prices, deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 8 * * *' # daily, ~4am US Eastern
  workflow_dispatch:
    inputs:
      update_prices:
        description: 'Refresh prices before building'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  prices:
    if: github.event_name == 'schedule' || inputs.update_prices
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh prices
        run: npm run update-prices
      - name: Commit updated prices
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/prices.json data/price-history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json data/price-history.json
            git commit -m "Update prices"
            # main may have moved during the run; only this job writes these files, so a rebase applies cleanly.
            for try in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              [ "$try" = 3 ] && exit 1
              sleep 10
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prices
    # Runs after the price refresh, or without it when that job is skipped.
    if: ${{ !cancelled() && (needs.prices.result == 'success' || needs.prices.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prices.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check-data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

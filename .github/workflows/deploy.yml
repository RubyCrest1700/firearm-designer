# Builds the site and publishes it to GitHub Pages (free for public repos).
# On the nightly schedule (or a manual run) it first refreshes data/prices.json
# from retailer product pages and commits the change.
name: Build, update prices, deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *' # daily, ~4am US Eastern
  workflow_dispatch:
    inputs:
      update_prices:
        description: 'Refresh prices before building'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Refresh prices
        if: github.event_name == 'schedule' || inputs.update_prices
        run: npm run update-prices
      - name: Commit updated prices
        if: github.event_name == 'schedule' || inputs.update_prices
        run: |
          if ! git diff --quiet data/prices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "Update prices"
            git push
          fi
      - run: npm run check-data
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

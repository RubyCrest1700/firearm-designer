# Temporary probe, lives only on the price-probe branch.
name: Price probe
on:
  push:
    branches: [price-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/probe.mjs

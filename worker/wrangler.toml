# Community builds API (Cloudflare Workers free plan + D1 free tier).
# Deployed by .github/workflows/deploy-worker.yml, which creates the database on first run
# and fills in database_id below.
name = "firearm-designer-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Served only on share.dropinbuilds.com (attached by the deploy workflow), not on a workers.dev address.
workers_dev = false
# No per-version preview addresses either: they would serve the API outside share.dropinbuilds.com.
preview_urls = false

# Daily, after the ~4am Eastern price refresh and site rebuild, as two runs so each has its own share of the
# free plan's per-run limits (src/index.js decides which jobs each one runs):
#   11:00 UTC  price alert emails
#   11:30 UTC  the feedback digest, and clearing out old personal data
[triggers]
crons = ["0 11 * * *", "30 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "firearm-designer"
database_id = "DATABASE_ID"
migrations_dir = "migrations"

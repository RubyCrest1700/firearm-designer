# Community builds API (Cloudflare Workers free plan + D1 free tier).
# Deployed by .github/workflows/deploy-worker.yml, which creates the database on first run
# and fills in database_id below.
name = "firearm-designer-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Price alert emails, daily at 11:00 UTC (7am Eastern), after the ~4am price refresh and site rebuild.
[triggers]
crons = ["0 11 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "firearm-designer"
database_id = "DATABASE_ID"
migrations_dir = "migrations"
